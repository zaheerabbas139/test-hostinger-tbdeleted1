name: CI/CD Pipeline (Validate, Build & Deploy)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_dir:
        description: 'Hostinger remote destination folder (relative to FTP root)'
        required: false
        default: 'public_html/'
      dry_run:
        description: 'Simulate deployment without modifying remote files'
        required: false
        default: false
        type: boolean

# Ensure minimal permissions following least-privilege security principle
permissions:
  contents: read

# Cancel redundant in-progress runs on PRs, but prevent cancelling in-flight deployments on main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: 'latest'

jobs:
  typecheck:
    name: Type & Schema Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Validate Astro Content Schemas & TypeScript
        run: npm run check

  security-audit:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Run dependency vulnerability audit
        run: npm audit --audit-level=high
        continue-on-error: true

  build:
    name: Production Build & Asset Archival
    needs: [typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Compile Astro Static Site (SSG)
        run: npm run build

      - name: Verify build artifact integrity
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "::error::Build verification failed! dist/index.html does not exist."
            exit 1
          fi
          echo "Build integrity verified: dist/ contains $(find dist -type f | wc -l) files."

      - name: Archive production build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: astro-production-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to Hostinger (FTPS)
    needs: [build]
    # Gated: Only run on main branch commits/pushes or manual triggers, NEVER on PRs, and ONLY if build succeeded
    if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://uat.pranast.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download compiled build artifact
        uses: actions/download-artifact@v4
        with:
          name: astro-production-dist
          path: dist

      - name: Verify downloaded deployment bundle
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "::error::Deployment package incomplete! dist/index.html not found."
            exit 1
          fi
          echo "Deployment bundle ready: dist/ contains $(find dist -type f | wc -l) files."

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check for Hostinger Deployment Secrets & Validate Endpoint
        id: check-secrets
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "### ⚠️ Deployment Secrets Missing" >> $GITHUB_STEP_SUMMARY
            echo "The CI build and validation succeeded, but deployment was skipped because Hostinger FTP secrets are not configured in GitHub repository settings." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**To enable automated deployment, configure these Secrets in GitHub (Repository or 'production' Environment):**" >> $GITHUB_STEP_SUMMARY
            echo "1. \`HOSTINGER_FTP_SERVER\` (Hostinger Server IP, e.g. \`147.79.69.127\`, or root domain \`pranast.com\` — do NOT use protocol prefixes like \`ftps://\` or unconfigured subdomains like \`ftp.pranast.com\`)" >> $GITHUB_STEP_SUMMARY
            echo "2. \`HOSTINGER_FTP_USERNAME\` (e.g. \`u715171369@pranast.com\` or FTP account name)" >> $GITHUB_STEP_SUMMARY
            echo "3. \`HOSTINGER_FTP_PASSWORD\` (FTP account password created in Hostinger hPanel)" >> $GITHUB_STEP_SUMMARY
            echo "4. \`HOSTINGER_TARGET_DIR\` (Optional, defaults to \`public_html/\`)" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          node - << 'EOF'
          const dns = require('dns').promises;
          const fs = require('fs');

          async function main() {
            const rawServer = process.env.FTP_SERVER || '';
            let server = rawServer.trim()
              .replace(/^[a-zA-Z0-9+.-]+:\/\//, '')
              .replace(/\/.*$/, '')
              .replace(/:[0-9]+$/, '')
              .trim();

            if (!server) {
              console.error('::error::HOSTINGER_FTP_SERVER secret is empty or invalid.');
              process.exit(1);
            }

            let resolvedIp = null;
            let fallbackUsed = false;

            try {
              const res = await dns.lookup(server, { family: 4 });
              resolvedIp = res.address;
            } catch (err) {
              if (server.startsWith('ftp.')) {
                const parentDomain = server.replace(/^ftp\./, '');
                try {
                  const res = await dns.lookup(parentDomain, { family: 4 });
                  resolvedIp = res.address;
                  server = parentDomain;
                  fallbackUsed = true;
                } catch (parentErr) {}
              }
            }

            if (!resolvedIp) {
              const summary = [
                '### ❌ Hostinger Deployment Failed: FTP Host Unreachable',
                `Could not resolve FTP server \`${rawServer}\` via DNS.`,
                '',
                '**Cause:**',
                'The host specified in \`HOSTINGER_FTP_SERVER\` does not exist in DNS (NXDOMAIN). Hostinger does not automatically configure an \`ftp.\` CNAME or A record for custom domains.',
                '',
                '**Recommended Fix:**',
                '1. Go to **Hostinger hPanel** &rsaquo; **Websites** &rsaquo; **Manage** &rsaquo; **FTP Accounts**.',
                '2. Copy the **FTP IP** or Hostinger Server IP (e.g. \`147.79.69.127\`).',
                '3. Update \`HOSTINGER_FTP_SERVER\` in GitHub Secrets (or environment secrets) to this IP address or root domain \`pranast.com\` (without \`ftps://\` or \`ftp://\` prefix).',
                ''
              ].join('\n');

              if (process.env.GITHUB_STEP_SUMMARY) {
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
              }
              console.error(`::error::FTP server '${rawServer}' cannot be resolved via DNS.`);
              process.exit(1);
            }

            if (fallbackUsed) {
              const notice = [
                '### ℹ️ Hostinger FTP Server Fallback Notice',
                `\`HOSTINGER_FTP_SERVER\` was configured as \`${rawServer}\`, but no DNS record exists for that host.`,
                `The pipeline automatically fell back to root domain \`${server}\` (IPv4: \`${resolvedIp}\`).`,
                '',
                'To optimize resolution, update your \`HOSTINGER_FTP_SERVER\` secret directly to \`pranast.com\` or the server IP in GitHub repository secrets.',
                ''
              ].join('\n');
              if (process.env.GITHUB_STEP_SUMMARY) {
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, notice);
              }
              console.log(`Automatic fallback applied: using ${server} (${resolvedIp})`);
            }

            if (process.env.GITHUB_OUTPUT) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_secrets=true\n`);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `ftp_server=${server}\n`);
            }
          }

          main().catch(err => {
            console.error('Validation error:', err);
            process.exit(1);
          });
          EOF

      - name: Synchronize Static Files to Hostinger (FTPS)
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.check-secrets.outputs.ftp_server }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ github.event.inputs.target_dir || secrets.HOSTINGER_TARGET_DIR || 'public_html/' }}
          dry-run: ${{ github.event.inputs.dry_run || false }}
          dangerous-clean-slate: false
