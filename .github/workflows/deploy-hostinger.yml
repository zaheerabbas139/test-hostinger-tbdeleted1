name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_dir:
        description: 'Hostinger remote destination folder (relative to FTP root)'
        required: false
        default: 'public_html/'
      dry_run:
        description: 'Simulate deployment without modifying remote files'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Do not cancel in-flight deployments to prevent partial/corrupted uploads
concurrency:
  group: deploy-hostinger-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://uat.pranast.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Validate Astro Content Schemas & TypeScript
        run: npm run check

      - name: Compile Astro Static Site (SSG)
        run: npm run build

      - name: Verify build artifact integrity
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "::error::Build verification failed! dist/index.html does not exist."
            exit 1
          fi

      - name: Check for Hostinger Deployment Secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.HOSTINGER_FTP_SERVER }}" ] || [ -z "${{ secrets.HOSTINGER_FTP_USERNAME }}" ] || [ -z "${{ secrets.HOSTINGER_FTP_PASSWORD }}" ]; then
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "### ⚠️ Deployment Secrets Missing" >> $GITHUB_STEP_SUMMARY
            echo "The build completed successfully, but deployment was skipped because Hostinger FTP secrets are not yet configured." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**To enable automated deployment, add the following GitHub Repository Secrets:**" >> $GITHUB_STEP_SUMMARY
            echo "1. \`HOSTINGER_FTP_SERVER\` (e.g. \`ftp.pranast.com\` or server IP)" >> $GITHUB_STEP_SUMMARY
            echo "2. \`HOSTINGER_FTP_USERNAME\` (e.g. \`u715171369@pranast.com\` or FTP account name)" >> $GITHUB_STEP_SUMMARY
            echo "3. \`HOSTINGER_FTP_PASSWORD\` (FTP account password created in Hostinger hPanel)" >> $GITHUB_STEP_SUMMARY
            echo "4. \`HOSTINGER_TARGET_DIR\` (Optional, defaults to \`public_html/\` or \`public_html/uat/\`)" >> $GITHUB_STEP_SUMMARY
          else
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          fi

      - name: Synchronize Static Files to Hostinger (FTPS)
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ github.event.inputs.target_dir || secrets.HOSTINGER_TARGET_DIR || 'public_html/' }}
          dry-run: ${{ github.event.inputs.dry_run || false }}
          dangerous-clean-slate: false

